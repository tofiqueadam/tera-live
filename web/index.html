<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tera Live — live minibus lines in Addis Ababa</title>
  <meta name="description" content="Crowdsourced live minibus queues and arrivals for Addis Ababa. One tap to report, see every tera at a glance.">
  <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1217" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/app.js">
</head>
<body>
  <a class="skip" href="#main" data-i18n="tab_list">Nearby</a>

  <header class="bar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">ተ</span>
      <span class="brand-text">
        <span class="brand-name" data-i18n="app_name">Tera Live</span>
        <span class="brand-tag mono" data-i18n="tagline">Addis Ababa · live lines</span>
      </span>
    </div>
    <div class="bar-actions">
      <button class="icon-btn lang" id="lang-btn" type="button" data-i18n="lang_switch" lang="am">አማርኛ</button>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Theme" data-i18n-aria="theme">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="sim" id="sim-badge" role="status" hidden>
    <strong class="sim-label mono">SIMULATED DATA</strong>
    <span class="sim-note" data-i18n="simulated_note">Demo mode: these reports are generated, not real.</span>
  </div>
  <div class="notice mono" id="notice" role="status" hidden></div>

  <nav class="tabs" aria-label="View">
    <button type="button" class="tab" data-view="list" aria-pressed="true"><span data-i18n="tab_list">Nearby</span></button>
    <button type="button" class="tab" data-view="map" aria-pressed="false"><span data-i18n="tab_map">Map</span></button>
  </nav>

  <main id="main" class="main" data-view="list">
    <section class="pane pane-list" aria-labelledby="list-title">
      <h2 id="list-title" class="visually-hidden" data-i18n="tab_list">Nearby</h2>
      <div class="list-tools">
        <label class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Search stations" data-i18n-placeholder="search_placeholder">
        </label>
        <button type="button" class="locate" id="locate-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="visually-hidden" data-i18n="locate">Use my location</span>
        </button>
      </div>
      <p class="list-meta mono" id="list-meta" aria-live="polite"></p>
      <ol class="stations" id="station-list"></ol>
      <footer class="foot mono">
        <span data-i18n="attribution">Stations © OpenStreetMap contributors (ODbL)</span>
        <a href="https://www.openstreetmap.org/copyright" rel="noopener">openstreetmap.org/copyright</a>
      </footer>
    </section>

    <section class="pane pane-map" aria-label="Map">
      <div id="map" class="map" role="region" aria-label="Map of stations"></div>
      <div class="legend" aria-hidden="true">
        <span class="lg"><i class="dot q-none"></i><span data-i18n="q_none">No line</span></span>
        <span class="lg"><i class="dot q-short"></i><span data-i18n="q_short">Short</span></span>
        <span class="lg"><i class="dot q-long"></i><span data-i18n="q_long">Long</span></span>
        <span class="lg"><i class="dot q-very_long"></i><span data-i18n="q_very_long">Very long</span></span>
      </div>
    </section>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title" hidden></aside>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
